services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jazida_phoenix_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jazida_phoenix_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - jazida_postgres:/var/lib/postgresql/data

volumes:
  jazida_postgres:
